[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-automation-prioritization"
version = "0.1.0"
description = "A CLI tool to evaluate and prioritize functional test automation candidates"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
test-automation-prioritization = "test_automation_prioritization.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/test_automation_prioritization"]
