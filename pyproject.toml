[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-automation-roi"
version = "0.1.0"
description = "Tool to determine if a test case is a good candidate for automation"
requires-python = ">=3.12"
dependencies = [
    "questionary>=2.1.1",
]

[project.scripts]
test-automation-roi = "test_automation_roi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/test_automation_roi"]
